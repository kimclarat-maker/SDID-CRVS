server {
    listen 80;
    server_name userguide;

    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # docs
    location /docs {
        alias /usr/share/nginx/html/guide;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # main app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}